function gastoModal(pre, id){
  const x = id ? S.fingastos.get(id) : {fecha:today(), tipo:'variable', conFactura:false, formaPago:'Transferencia', ...(pre||{})};
  const links = [...[...S.cotizaciones.values()].filter(q=>q.estado==='aceptada').map(q=>({key:'cot:'+q.id, label:`Cotización N° ${pad(q.numero)} · ${q.cliente?.nombre||''}`})), ...[...S.trabajos.values()].filter(t=>!t.importado).map(t=>({key:'trabajo:'+t.id, label:`Trabajo N° ${pad(t.numero)} · ${cli(t.clienteId)?.nombre||''}`}))];
  const provs = [...new Set(finGastos().map(g=>g.proveedor).filter(Boolean))];
  modal(`<div class="dlg" style="width:min(640px,100%)"><header><h2>${id?'Editar gasto':'Registrar gasto'}</h2></header><div class="body" id="gasbox"><div class="grid">
    <div class="f c4"><label for="fg-fecha">Fecha</label><input class="in" id="fg-fecha" type="date" value="${esc(x.fecha)}"></div>
    <div class="f c4"><label for="fg-tipo">Tipo</label><select class="in" id="fg-tipo">${GASTO_TIPOS.map(([k,l])=>`<option value="${k}" ${x.tipo===k?'selected':''}>${l}</option>`).join('')}</select></div>
    <div class="f c4"><label for="fg-cat">Categoría</label><select class="in" id="fg-cat"></select></div>
    <div class="f c8"><label for="fg-det">Detalle <span class="req">*</span></label><input class="in" id="fg-det" value="${esc(x.detalle||'')}" placeholder="Ej: Equipo 18.000 BTU para instalación"></div>
    <div class="f c4"><label for="fg-prov">Proveedor</label><input class="in" id="fg-prov" list="fg-provs" value="${esc(x.proveedor||'')}"><datalist id="fg-provs">${provs.map(p=>`<option value="${esc(p)}">`).join('')}</datalist></div>
    <div class="f c4"><label for="fg-monto">Monto pagado (total) <span class="req">*</span></label><input class="in num" id="fg-monto" type="number" min="0" value="${esc(x.monto??'')}"></div>
    <div class="f c4" style="align-self:end"><label class="check"><input type="checkbox" id="fg-fac" ${x.conFactura?'checked':''}><span class="small">Con factura (IVA recuperable)</span></label></div>
    <div class="f c4"><label>Neto / IVA crédito</label><div class="in small" id="fg-net" style="background:none">—</div></div>
    <div class="f c6"><label for="fg-forma">Forma de pago</label><select class="in" id="fg-forma">${FORMAS_PAGO.map(f=>`<option ${x.formaPago===f?'selected':''}>${f}</option>`).join('')}</select></div>
    <div class="f c6"><label for="fg-link">Asociado a</label><select class="in" id="fg-link"><option value="">Ninguno</option>${links.map(l=>`<option value="${esc(l.key)}" ${x.vinculo?.key===l.key?'selected':''}>${esc(l.label)}</option>`).join('')}</select></div>
    <div class="f"><label for="fg-file">Comprobante <span class="muted">(foto o PDF, opcional)</span></label><input class="in" id="fg-file" type="file" accept="image/*,application/pdf">${x.comprobante?`<span class="hint">Ya tiene comprobante. Sube otro para reemplazarlo.</span>`:''}</div>
  </div><p class="err" id="fgerr"></p></div>
  <footer>${id?`<button class="btn red" style="margin-right:auto" data-act="fin-gas-del" data-id="${esc(id)}">Eliminar</button>`:''}<button class="btn" data-act="close">Cancelar</button><button class="btn pri" data-act="fin-gas-save" data-id="${esc(id||'')}">Guardar</button></footer></div>`);
  S.finGasPre = pre||null;
  const cat = $('#fg-cat'), fillCat = () => { const cs = GASTO_CATS[$('#fg-tipo').value]; const cur = x.categoria && cs.includes(x.categoria) ? x.categoria : cat.value; cat.innerHTML = cs.map(c=>`<option ${c===cur?'selected':''}>${c}</option>`).join(''); };
  const sync = () => { const m=+$('#fg-monto').value||0, f=$('#fg-fac').checked; $('#fg-net').textContent = f ? `${clp(Math.round(m/1.19))} / ${clp(m-Math.round(m/1.19))}` : `${clp(m)} / $0`; };
  $('#fg-tipo').addEventListener('change', fillCat); fillCat(); $('#gasbox').addEventListener('input', sync); $('#gasbox').addEventListener('change', sync); sync();
}
async function gastoSave(id){
  const err=$('#fgerr'), v = k => $('#fg-'+k).value.trim();
  const monto = Math.round(+v('monto')||0); if (!v('det')) { err.textContent='Ingresa el detalle.'; return; } if (!(monto>0)) { err.textContent='Ingresa el monto.'; return; }
  const prev = id ? strip(S.fingastos.get(id)) : {creado:today(), ...(S.finGasPre||{})};
  const lk = v('link'); const linkSel = $('#fg-link').selectedOptions[0];
  const data = {...prev, fecha:v('fecha')||today(), tipo:v('tipo'), categoria:v('cat'), detalle:v('det'), proveedor:v('prov'), monto, conFactura:$('#fg-fac').checked, formaPago:v('forma'), vinculo: lk?{key:lk,label:linkSel.textContent}:null, omitido:false};
  try { busy(true);
    const file = $('#fg-file').files[0];
    if (file) { if (!assets && !S.demo) throw new Error('No tienes permiso para subir archivos.'); const blob = /^image\//.test(file.type) ? await shrink(file, 1800) : file; data.comprobante = S.demo ? '' : (await assets.upload(blob, {type: /^image\//.test(file.type)?'image/jpeg':'application/pdf', priv:true})).id; }
    await Data.set('fingastos', id || uid('fg'), data); modal(''); toast(id?'Gasto actualizado':'Gasto registrado'); }
  catch(e){ err.textContent = e.code ? writeErr(e) : (e.message||'No se pudo guardar.'); } finally { busy(false); }
}
function recModal(){
  const rs = [...S.finrecurrentes.values()].sort((a,b)=>(a.dia||1)-(b.dia||1));
  modal(`<div class="dlg" style="width:min(680px,100%)"><header><h2>Gastos fijos recurrentes</h2><p class="muted small" style="margin:0">Cada mes aparecen en Gastos como "por confirmar". Los apruebas con un clic y puedes ajustar el monto.</p></header><div class="body">
    ${rs.length?`<div class="list" style="gap:0;margin-bottom:14px">${rs.map(r=>`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line)"><div class="grow"><b>${esc(r.nombre)}</b> <span class="small muted">· ${esc(r.categoria)} · día ${esc(r.dia||1)}${r.conFactura?' · factura':''}${r.activo===false?' · pausado':''}</span></div><span class="money">${clp(r.monto)}</span><button class="btn ghost sm" data-act="fin-rec-edit" data-id="${esc(r.id)}">Editar</button></div>`).join('')}</div>`:'<p class="muted small">Aún no hay gastos recurrentes.</p>'}
    <h3 style="margin:8px 0" id="rc-title">Agregar recurrente</h3><div class="grid">
      <div class="f c6"><label for="rc-nom">Nombre <span class="req">*</span></label><input class="in" id="rc-nom" placeholder="Ej: Arriendo de local"></div>
      <div class="f c6"><label for="rc-cat">Categoría</label><select class="in" id="rc-cat">${GASTO_CATS.fijo.map(c=>`<option>${c}</option>`).join('')}</select></div>
      <div class="f c4"><label for="rc-monto">Monto mensual</label><input class="in num" id="rc-monto" type="number" min="0"></div>
      <div class="f c4"><label for="rc-dia">Día de pago</label><input class="in" id="rc-dia" type="number" min="1" max="28" value="1"></div>
      <div class="f c4" style="align-self:end"><label class="check"><input type="checkbox" id="rc-fac"><span class="small">Con factura</span></label></div>
      <div class="f c6"><label class="check"><input type="checkbox" id="rc-act" checked><span class="small">Activo</span></label></div>
    </div><p class="err" id="rcerr"></p></div>
    <footer><button class="btn" data-act="close">Cerrar</button><button class="btn pri" data-act="fin-rec-save" id="rc-save" data-id="">Guardar recurrente</button></footer></div>`);
}

Object.assign(ACT, {

  'fin-goto-mes': b => { S.finMes = b.dataset.ym; go('fin-mes'); },
  'fin-mes-mv': b => { const n=+b.dataset.n; S.finMes = n===0 ? ymOf(today()) : ymAdd(S.finMes||ymOf(today()), n); render(); },
  'fin-gas-mv': b => { S.finGasMes = ymAdd(S.finGasMes||ymOf(today()), +b.dataset.n); render(); },

  'fin-meta-ok': async b => { const ym=b.dataset.ym, v=Math.round(+$('#mt-v').value||0), c=finCfg(); const metas={...(c.metas||{}), [ym]:v}; const data={...c, metas};
    if ($('#mt-def').checked) { data.metaDefault = v; Object.keys(metas).forEach(k=>{ if (k>ym) delete metas[k]; }); for (let m=ymAdd(ymOf(today()),-24); m<ym; m=ymAdd(m,1)) if (metas[m]==null) metas[m] = +(c.metaDefault ?? 12000000); }
    try { await Data.setFinCfg(data); modal(''); toast('Meta actualizada'); } catch(e){ $('#mterr').textContent=writeErr(e); } },
  'fi-tipo': b => { S.finIngTipo=b.dataset.k; render(); }, 'fi-est': b => { S.finIngEst=b.dataset.k; render(); },
  'fin-ing-new': () => ingresoModal(null), 'fin-ing-edit': b => ingresoModal(null, b.dataset.id), 'fin-ing-save': b => ingresoSave(b.dataset.id||null),
  'fin-dup-ok': () => { S.finDupOk = true; ingresoSave($('[data-act="fin-ing-save"]').dataset.id||null); },
  'fin-ing-del': b => { if (b.dataset.confirm!=='1') { b.dataset.confirm='1'; b.textContent='¿Eliminar? Confirmar'; return; } Data.del('finingresos', b.dataset.id).then(()=>{ modal(''); toast('Ingreso eliminado'); }).catch(e=>$('#fierr').textContent=writeErr(e)); },
  'fin-reg': b => { const x = porRegistrar().find(z=>z.key===b.dataset.key); if (x) ingresoModal(x.pre); },
  'fin-omit': async b => { try { await Data.set('finomit', b.dataset.key.replace(/:/g,'_'), {key:b.dataset.key, fecha:today()}); toast('No se registrará'); } catch(e){ toast(writeErr(e)); } },
  'fin-pagar': b => pagarModal(b.dataset.id),
  'fin-pagar-ok': async b => { const i=S.finingresos.get(b.dataset.id); try { await Data.set('finingresos', i.id, {...strip(i), pagado:true, fechaPago:$('#pp-f').value||today(), formaPago:$('#pp-m').value}); modal(''); toast('Pago registrado'); } catch(e){ $('#pperr').textContent=writeErr(e); } },
  'fin-gas-new': () => gastoModal(null), 'fin-gas-edit': b => gastoModal(null, b.dataset.id), 'fin-gas-save': b => gastoSave(b.dataset.id||null),
  'fin-gas-del': b => { if (b.dataset.confirm!=='1') { b.dataset.confirm='1'; b.textContent='¿Eliminar? Confirmar'; return; } Data.del('fingastos', b.dataset.id).then(()=>{ modal(''); toast('Gasto eliminado'); }).catch(e=>$('#fgerr').textContent=writeErr(e)); },
  'fin-rec': recModal,
  'fin-rec-edit': b => { const r=S.finrecurrentes.get(b.dataset.id); $('#rc-title').textContent='Editar: '+r.nombre; $('#rc-nom').value=r.nombre; $('#rc-cat').value=r.categoria; $('#rc-monto').value=r.monto; $('#rc-dia').value=r.dia||1; $('#rc-fac').checked=!!r.conFactura; $('#rc-act').checked=r.activo!==false; $('#rc-save').dataset.id=r.id; $('#rc-nom').focus(); },
  'fin-rec-save': async b => { const nombre=$('#rc-nom').value.trim(); if (!nombre) { $('#rcerr').textContent='Ingresa el nombre.'; return; }
    const id = b.dataset.id || uid('fr'); const prev = b.dataset.id ? strip(S.finrecurrentes.get(id)) : {desde:ymOf(today())};
    try { await Data.set('finrecurrentes', id, {...prev, nombre, categoria:$('#rc-cat').value, monto:Math.round(+$('#rc-monto').value||0), dia:Math.min(28,Math.max(1,+$('#rc-dia').value||1)), conFactura:$('#rc-fac').checked, activo:$('#rc-act').checked}); recModal(); toast('Recurrente guardado'); } catch(e){ $('#rcerr').textContent=writeErr(e); } },
  'fin-rec-ok': b => { const r=S.finrecurrentes.get(b.dataset.id), ym=b.dataset.ym; gastoModal({tipo:'fijo', categoria:r.categoria, detalle:r.nombre, monto:r.monto, conFactura:!!r.conFactura, fecha:`${ym}-${String(r.dia||1).padStart(2,'0')}`, recurrenteId:r.id, mesRec:ym}); },
  'fin-rec-skip': async b => { const r=S.finrecurrentes.get(b.dataset.id), ym=b.dataset.ym; try { await Data.set('fingastos', uid('fg'), {fecha:`${ym}-01`, tipo:'fijo', categoria:r.categoria, detalle:r.nombre+' (omitido)', monto:0, recurrenteId:r.id, mesRec:ym, omitido:true, creado:today()}); toast('Omitido este mes'); } catch(e){ toast(writeErr(e)); } },
  'fin-facturar': b => { const q=S.cotizaciones.get(b.dataset.id); ingresoModal(finPreCot(q)); },
});

  'pw-modal': () => passModal(false),
  'pw-save': async () => {
    const p1 = $('#pw-1').value, p2 = $('#pw-2').value, err = $('#pwerr');

    if (error) { err.textContent = /different/i.test(error.message) ? 'La nueva contraseña debe ser distinta de la anterior.' : 'No se pudo guardar: ' + error.message; return; }
    modal(''); toast('Contraseña guardada');
  },
  'logout': () => Auth.logout(),
});
