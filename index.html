<!doctype html><html lang="es"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>Pneuma</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0B2A5B">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

</head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Single light look by request: light blue-grey ground in every viewer theme. */
/* Layout: navy service-band header with area tabs, then a single working column (max 1080px) of operable panels. */
:root{
  color-scheme:light;
  --bg:#E4EBF3; --surface:#FFFFFF; --surface-2:#F5F8FC; --ink:#0E1B2E; --muted:#56657C; --line:#D5DDE8;
  --navy:#0B2A5B; --primary:#1257B8; --primary-ink:#FFFFFF; --cyan:#1A9FDB; --red:#C8191F;
  --ok:#1E7F4F; --ok-bg:#E3F4EA; --warn:#9A5B00; --warn-bg:#FFF1D6; --info:#1257B8; --info-bg:#E2ECFA; --grey-bg:#E9EDF2; --red-bg:#FDE7E8;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s-gasto:#A3ACBA; --st-serious:#ec835a; --st-critical:#d03b3b; --cal:42,120,214;
  --plate-bg:#FFFFFF; --plate-ink:#111;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
[hidden]{display:none!important}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}

/* header */
.top{background:var(--navy);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;box-shadow:0 1px 0 rgba(255,255,255,.06)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:10px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .plate{background:#fff;border-radius:7px;padding:5px 9px;display:flex}
.brand img{height:28px;width:auto;display:block}
.brand b{font-family:var(--f-display);font-size:20px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.who{margin-left:auto;font-size:12.5px;text-align:right;display:flex;align-items:center;gap:8px}
.who .nm{opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
.who button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:6px;padding:5px 10px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.who button:hover{background:rgba(255,255,255,.2)}
.login{max-width:380px;margin:48px auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px}
.login h1{margin:0 0 4px;font-size:28px}
.login .f{margin-top:14px}
.login .btn{width:100%;justify-content:center;margin-top:18px}
.login .lnk{background:none;border:0;color:var(--primary);padding:0;margin-top:14px;cursor:pointer;font-size:13.5px;text-decoration:underline}
.areas{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.areas::-webkit-scrollbar{display:none}
.areas button{background:none;border:0;color:#BFD0EA;padding:10px 14px 11px;font-family:var(--f-display);font-size:16px;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.areas button[aria-current="true"]{color:#fff;border-bottom-color:var(--red)}
.areas button:hover{color:#fff}
.areas .soon{font-size:10px;letter-spacing:.08em;opacity:.7;margin-left:4px}

/* sub nav */
.subnav{display:flex;gap:6px;padding-block:14px 4px;overflow-x:auto;scrollbar-width:none}
.subnav button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 15px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap;color:var(--muted)}
.subnav button[aria-current="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
main{padding-bottom:90px}
.banner{margin-top:12px;border-radius:var(--r);padding:10px 14px;font-size:14px;background:var(--warn-bg);color:var(--warn)}

h1,h2,h3{font-family:var(--f-display);letter-spacing:.02em;margin:0;text-wrap:balance;font-weight:700}
h1{font-size:30px;line-height:1.1}
h2{font-size:21px;text-transform:uppercase;letter-spacing:.05em}
h3{font-size:16px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:18px 0 14px}
.head p{margin:4px 0 0;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 auto;min-width:0}
.stack{display:grid;gap:14px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.panel>h3{margin-bottom:12px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 15px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink);font-size:14.5px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.red{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,var(--line))}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px}

/* patente plate */
.pat{display:inline-flex;align-items:center;font-family:var(--f-mono);font-weight:600;letter-spacing:.06em;background:var(--plate-bg);color:var(--plate-ink);border:1.5px solid #222;border-radius:5px;padding:1px 7px;font-size:13.5px;line-height:1.4;white-space:nowrap;position:relative}
.pat::before{content:"CHILE";font-family:var(--f-body);font-size:6px;letter-spacing:.12em;position:absolute;top:-1px;left:50%;transform:translateX(-50%);color:#555}
.pat.lg{font-size:24px;padding:4px 14px;border-width:2px;border-radius:7px}
.pat.lg::before{font-size:8px;top:0}

/* search hero */
.search{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:12px;margin-top:16px}
.search label{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.08em;font-size:15px;color:var(--muted)}
.plateinput{display:flex;align-items:center;background:var(--plate-bg);border:2.5px solid #1b1b1b;border-radius:10px;padding:6px 14px;max-width:440px;position:relative}
.plateinput::before{content:"CHILE";position:absolute;top:2px;left:50%;transform:translateX(-50%);font-size:9px;letter-spacing:.2em;color:#555}
.plateinput input{border:0;background:none;outline:none;font-family:var(--f-mono);font-weight:600;font-size:30px;letter-spacing:.14em;text-transform:uppercase;color:#111;width:100%;min-width:0;padding-top:6px}
.plateinput input::placeholder{color:#B8B8B8}
.plateinput:focus-within{box-shadow:0 0 0 3px color-mix(in srgb,var(--cyan) 45%,transparent)}

.list{display:grid;gap:8px}
.item{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;text-align:left;width:100%}
.item:hover{border-color:var(--muted)}
.item .t{font-weight:600}
.item .s{color:var(--muted);font-size:13.5px}
.item .r{margin-left:auto;text-align:right;display:grid;gap:4px;justify-items:end;flex:none}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.money{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:26px;text-align:center;color:var(--muted);display:grid;gap:10px;justify-items:center}

.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-diagnostico{background:var(--grey-bg);color:var(--muted)}
.st-cotizado{background:var(--info-bg);color:var(--info)}
.st-proceso{background:var(--warn-bg);color:var(--warn)}
.st-terminado{background:var(--ok-bg);color:var(--ok)}
.st-entregado{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--primary);color:var(--primary);background:color-mix(in srgb,var(--primary) 9%,var(--surface))}
.chip .n{font-family:var(--f-mono);margin-left:4px}

.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;cursor:pointer;text-align:left}
.stat b{display:block;font-family:var(--f-display);font-size:28px;line-height:1}
.stat span{font-size:12.5px;color:var(--muted)}

/* forms */
.form{display:grid;gap:16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(12,1fr)}
.f{display:grid;gap:5px;grid-column:span 12;min-width:0}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c6{grid-column:span 6}.c8{grid-column:span 8}.c2{grid-column:span 2}
.f label{font-size:12.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.f label .req{color:var(--red)}
.in{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:9px 11px;min-width:0}
.in:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 20%,transparent);background:var(--surface)}
textarea.in{min-height:92px;resize:vertical}
.in.patin{font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.1em;font-weight:600}
.unit{position:relative}
.unit .in{padding-right:44px}
.unit span{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:12.5px;color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted)}
.err{font-size:13px;color:var(--red)}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--primary)}
.savebar{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);z-index:6;padding-bottom:env(safe-area-inset-bottom,0px)}
.savebar .wrap{display:flex;gap:10px;align-items:center;padding-block:10px}
.savebar .tot{margin-right:auto;font-size:13px;color:var(--muted)}
.savebar .tot b{font-size:19px;color:var(--ink);display:block;line-height:1.1}

/* line items */
.lines{display:grid;gap:8px}
.line{display:grid;grid-template-columns:1fr 92px 110px 110px 34px;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.line .d{min-width:0}
.line .d b{display:block;font-weight:600;font-size:14px}
.line .d small{color:var(--muted);font-family:var(--f-mono);font-size:11.5px}
.line .in{background:var(--surface);padding:6px 8px}
.line .money{text-align:right}
.line .x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:20px;line-height:1;padding:4px}
.line .x:hover{color:var(--red)}
.lineshead{display:grid;grid-template-columns:1fr 92px 110px 110px 34px;gap:8px;padding:0 10px;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.lineshead span:nth-child(n+3){text-align:right}
.totals{display:grid;gap:4px;justify-items:end;margin-top:6px}
.totals div{display:flex;gap:18px;font-size:14px}
.totals div span:first-child{color:var(--muted)}
.totals .big{font-size:20px;font-weight:700}
.totals .big span:first-child{color:var(--ink)}

/* photos */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ph{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface-2);display:grid}
.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--grey-bg)}
.ph .in{border:0;border-top:1px solid var(--line);border-radius:0;font-size:13px;padding:6px 8px}
.ph .bar{display:flex;justify-content:space-between;align-items:center;padding:4px 6px 4px 9px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.ph .bar button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:12.5px}
.ph .bar button:hover{color:var(--red)}
.ph.loading{place-items:center;min-height:140px;color:var(--muted);font-size:13px}
.upl{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}

/* detail */
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px 18px}
.kv div span{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.kv div b{font-weight:600;overflow-wrap:anywhere}
.txt{white-space:pre-wrap;overflow-wrap:anywhere}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.vehcard{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td.r,.tbl th.r{text-align:right}
.tblwrap{overflow-x:auto}
.warranty{display:flex;gap:10px;align-items:flex-start;border-radius:8px;padding:10px 12px;font-size:14px}
.warranty.on{background:var(--ok-bg);color:var(--ok)}
.warranty.off{background:var(--grey-bg);color:var(--muted)}

/* catalog */
.cat h3{margin:18px 0 8px}
.svc{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:start;padding:11px 14px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.svc+.svc{margin-top:6px}
.svc code{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:2px}
.svc .n{font-weight:600}
.svc .dt{font-size:13px;color:var(--muted);margin-top:3px}
.svc .p{text-align:right;display:grid;gap:4px;justify-items:end}
.svc.off{opacity:.55}
.svc .price{width:120px;text-align:right}

/* modal */
.modal{position:fixed;inset:0;background:rgba(5,12,24,.55);z-index:20;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dlg{background:var(--surface);border-radius:14px;width:min(640px,100%);max-height:100%;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;border:1px solid var(--line)}
.dlg header{padding:16px 18px 10px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.dlg .body{overflow:auto;padding:12px 18px}
.dlg footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.pick{display:grid;grid-template-columns:1fr auto;gap:10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 2px;cursor:pointer}
.pick:hover{background:var(--surface-2)}
.pick small{display:block;color:var(--muted);font-size:12.5px}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
.soonbox{margin-top:28px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;display:grid;gap:8px;max-width:620px}
.soonbox .tag{font-family:var(--f-display);color:var(--red);letter-spacing:.12em;text-transform:uppercase;font-size:14px}

/* extintor */
.segnav{display:flex;gap:2px;background:var(--grey-bg);border-radius:9px;padding:3px;margin:0 0 12px;overflow-x:auto;width:fit-content;max-width:100%}
.segnav button{border:0;background:none;padding:7px 14px;border-radius:7px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap}
.segnav button[aria-current="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.basebox{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.seg button{border:0;background:var(--surface);padding:6px 14px;font-weight:600;font-size:13.5px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.basebox p{flex:1 1 280px}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:3px;min-width:0}
.kpi span{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.kpi b{font-family:var(--f-display);font-size:26px;line-height:1.05;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi small{font-size:12.5px;color:var(--muted)}
.kpi small b{font:inherit;font-weight:700}
.chartbox{overflow-x:auto}
.chartbox svg{min-width:560px}
.kpi.alert{border-color:var(--red);box-shadow:inset 3px 0 0 var(--red)}
.kpi[data-act]{cursor:pointer}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i,.tip i{width:10px;height:10px;border-radius:2px;display:inline-block;flex:none}
.chartbox,.calgrid{position:relative}
.tip{position:absolute;z-index:4;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;box-shadow:0 6px 18px rgba(0,0,0,.14);pointer-events:none;min-width:190px}
.tip div{display:flex;gap:8px;align-items:center;margin-top:3px}
.tip div span{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:600}
.chartbox .hit.on{fill:color-mix(in srgb,var(--ink) 5%,transparent)}
.hbars{display:grid;gap:9px}
.hb{display:grid;grid-template-columns:minmax(90px,170px) 1fr auto;gap:10px;align-items:center;font-size:13.5px}
.hb .l{min-width:0;overflow-wrap:anywhere;line-height:1.25}
.hb .b{height:12px;background:var(--grey-bg);border-radius:3px;overflow:hidden}
.hb .b i{display:block;height:100%;background:var(--s1);border-radius:0 3px 3px 0}
.hb .v{font-size:13px;min-width:84px;text-align:right}
.meter{height:10px;background:var(--grey-bg);border-radius:5px;overflow:hidden;margin-top:10px}
.meter i{display:block;height:100%;background:var(--s1);border-radius:5px}
.big-n b{font-family:var(--f-display);font-size:30px}
.big-pct{font-family:var(--f-display);font-size:34px;font-weight:700}
.calwrap{overflow-x:auto}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(64px,1fr)) minmax(110px,1.3fr);gap:4px;min-width:600px}
.ch{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:2px 4px}
.ch.r{text-align:right}
.cd{min-height:58px;border-radius:7px;border:1px solid var(--line);padding:5px 7px;display:grid;align-content:space-between;background:rgba(var(--cal),var(--a,0))}
.cd.empty{border:0;background:none}
.cd.today{outline:2px solid var(--ink);outline-offset:-2px}
.cd .dn{font-size:12px;color:var(--muted)}
.cd .dv{font-weight:700;font-size:13.5px;text-align:right;font-variant-numeric:tabular-nums}
.cd.hit.on{border-color:var(--ink)}
.cw{display:grid;align-content:center;justify-items:end;padding:4px 6px;border-left:2px solid var(--line)}
.cw small{font-size:11.5px;color:var(--muted)}
.sumtbl{display:grid;gap:6px;font-size:14px}
.sumtbl div{display:flex;justify-content:space-between;gap:10px}
.sumtbl div span:first-child{display:inline-flex;gap:7px;align-items:center}
.sumtbl i{width:10px;height:10px;border-radius:2px;display:inline-block}
.sumtbl .t{border-top:1px solid var(--line);padding-top:6px;font-weight:700}
.lnk{border:0;background:none;padding:0;color:var(--primary);font-weight:600;cursor:pointer;font-size:inherit}
.ttag.fin-auto{color:var(--s1);border-color:color-mix(in srgb,var(--s1) 40%,var(--line))}
.ttag.fin-externo{color:var(--s2);border-color:color-mix(in srgb,var(--s2) 40%,var(--line))}
.ttag.fin-factura{color:var(--ok);border-color:color-mix(in srgb,var(--s3) 45%,var(--line))}
@media (max-width:760px){ .kpis{grid-template-columns:repeat(2,1fr)!important} .hb{grid-template-columns:100px 1fr auto} }
/* administración */
.dot{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-family:var(--f-body);font-size:11px;font-weight:700;margin-left:6px;letter-spacing:0;vertical-align:1px}
.subnav .dot{height:17px}
.st-borrador{background:var(--grey-bg);color:var(--muted)}
.st-enviada{background:var(--info-bg);color:var(--info)}
.st-aceptada{background:var(--ok-bg);color:var(--ok)}
.st-rechazada{background:var(--red-bg);color:var(--red)}
.st-pendiente{background:var(--warn-bg);color:var(--warn)}
.st-contactado{background:var(--info-bg);color:var(--info)}
.st-agendado{background:var(--ok-bg);color:var(--ok)}
.ttag{display:inline-block;font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--muted);white-space:nowrap}
.ttag.mantencion{color:var(--primary);border-color:color-mix(in srgb,var(--primary) 35%,var(--line))}
.ttag.instalacion{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,var(--line))}
.ttag.pmp{color:var(--primary);border-color:color-mix(in srgb,var(--primary) 35%,var(--line))}
.ttag.contrato{color:var(--red);border-color:color-mix(in srgb,var(--red) 35%,var(--line))}
.ttag.inst{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,var(--line))}
.ttag.automotriz{color:var(--s1);border-color:color-mix(in srgb,var(--s1) 40%,var(--line))}
.ttag.electrico{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}
.tipos{display:flex;gap:8px;flex-wrap:wrap}
.tipos label{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;background:var(--surface-2);font-weight:600;font-size:14px}
.tipos input{width:17px;height:17px;accent-color:var(--primary)}
.tipos label:has(input:checked){border-color:var(--primary);background:color-mix(in srgb,var(--primary) 8%,var(--surface))}
.qitems{display:grid;gap:10px}
.qitem{border:1px solid var(--line);border-radius:10px;background:var(--surface-2);padding:12px;display:grid;gap:10px}
.qitem .qtop{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center}
.qitem .no{font-family:var(--f-mono);font-weight:600;color:var(--muted)}
.qitem .tools{display:flex;gap:2px}
.qitem .tools button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:15px;padding:4px 6px;border-radius:5px}
.qitem .tools button:hover{background:var(--grey-bg);color:var(--ink)}
.qitem .tools button.del:hover{color:var(--red)}
.qitem .nums{display:grid;grid-template-columns:1fr 130px 90px 130px;gap:10px;align-items:end}
.qitem .nums .f{grid-column:auto}
.qitem .nums .money{text-align:right;font-size:16px;padding-bottom:9px}
.qitem textarea.in{min-height:70px;font-size:14px}
.qitem .in{background:var(--surface)}
.zero{color:var(--warn);font-size:12px;font-weight:600}
.calc{display:grid;gap:12px}
.calc .prev{border:1px dashed var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:4px;font-size:14px}
.calc .prev div{display:flex;justify-content:space-between;gap:10px}
.agrow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.agrow .when{font-family:var(--f-display);font-size:18px;line-height:1.1}
.agrow.late{border-left:4px solid var(--red)}
.agrow.soon{border-left:4px solid var(--warn)}
.agrow .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.secthead{display:flex;align-items:baseline;gap:10px;margin:22px 0 10px}
.secthead h2{font-size:18px}
@media (max-width:760px){
  .qitem .nums{grid-template-columns:1fr 1fr}
  .qitem .nums .f:first-child{grid-column:1 / -1}
  .agrow{grid-template-columns:1fr}
  .agrow .acts{justify-content:flex-start}
}
@media (max-width:760px){
  .stats{grid-template-columns:repeat(3,1fr)}
  .two{grid-template-columns:1fr}
  .c3,.c4{grid-column:span 6}.c6,.c8,.c2{grid-column:span 12}
  .line,.lineshead{grid-template-columns:1fr 70px 96px 30px}
  .line .pu,.lineshead .pu{display:none}
  .brand b{display:none}
  h1{font-size:26px}
}
@media (max-width:420px){ .stats{grid-template-columns:repeat(2,1fr)} .plateinput input{font-size:24px} .svc{grid-template-columns:1fr auto}.svc code{display:none} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

/* Every row of table docs is one document: (col, id) -> data. Single documents config/empresa and finconfig/general live there too. */
function applyDoc(col, id, data){
  if (col==='config') { if (id==='empresa') S.cfg = {...DEFAULT_CFG, ...(data||{})}; return; }
  if (col==='finconfig') { if (id==='general') S.finconfig = data || null; return; }
  if (!(S[col] instanceof Map)) return;
  if (data) S[col].set(id, {id, ...data}); else S[col].delete(id);
}

/* Sign-in. The service worker reads the access token from Cache Storage to fetch private photos at ./_blob/<id>. */
const Auth = {
  tipo: new URLSearchParams(location.hash.slice(1)).get('type'),
  async saveToken(session){
    try { const c = await caches.open('pneuma-auth'), k = new URL('__token', location.href).href;
      if (session) await c.put(k, new Response(session.access_token)); else await c.delete(k); } catch {}
  },
  async login(){
    const email = $('#lg-email').value.trim().toLowerCase(), password = $('#lg-pass').value, err = $('#lgerr');
    S.loginEmail = email;
    if (!email || !password) { err.textContent = 'Escribe tu correo y contraseña.'; return; }
    err.textContent = 'Ingresando…';
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) { err.textContent = /invalid/i.test(error.message) ? 'Correo o contraseña incorrectos.' : 'No se pudo ingresar: ' + error.message; return; }
    S.loginMsg = ''; await Data.start(data.session);
  },
  async olvido(){
    const email = $('#lg-email').value.trim().toLowerCase(), err = $('#lgerr');
    if (!email) { err.textContent = 'Escribe tu correo arriba y vuelve a presionar.'; return; }
    err.textContent = 'Enviando…';
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
    err.textContent = error ? 'No se pudo enviar el correo: ' + error.message : 'Si el correo está autorizado, te llegará un enlace para crear tu contraseña. Ábrelo en este mismo dispositivo.';
  },
  async logout(){
    try { await sb.auth.signOut(); } catch {}
    await Auth.saveToken(null);
    try { await caches.delete('pneuma-fotos'); } catch {}
    location.replace(location.pathname);
  }
};

const Data = {
  async init(){
    if (!window.supabase) { $('#view').innerHTML = `<p class="muted" style="padding-top:24px">Sin conexión. Revisa tu internet y vuelve a abrir la app.</p>`; return; }
    sb = supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession:true, autoRefreshToken:true, detectSessionInUrl:true } });
    sb.auth.onAuthStateChange((ev, session) => {
      Auth.saveToken(session);
      if (ev === 'PASSWORD_RECOVERY') Auth.tipo = 'recovery';
    });
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { S.login = true; render(); return; }
    await Data.start(session);
  },
  async start(session){
    await Auth.saveToken(session);
    const email = (session.user.email || '').toLowerCase();
    const { data: u, error } = await sb.from('app_users').select('nombre,rol').eq('email', email).maybeSingle();
    if (error || !u) {
      await sb.auth.signOut(); S.login = true;
      S.loginMsg = error ? 'No se pudo verificar tu acceso. Revisa tu conexión.' : 'Este correo no tiene acceso a Pneuma. Pide acceso al administrador.';
      render(); return;
    }
    S.login = false; S.uid = session.user.id; S.email = email; S.nombre = u.nombre;
    S.canEdit = S.isOwner = u.rol === 'admin'; S.canWrite = true;
    if (!S.isOwner) { S.area = 'auto'; S.route = {name:'inicio'}; }
    assets = { upload: async (blob, o={}) => ({ id: await Data.upload(blob, o) }), delete: id => Data.dropPhoto(id) };
    downloads = { async save({filename, data}){
      const url = URL.createObjectURL(data), a = document.createElement('a');
      a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    } };
    render();
    try { await Data.loadAll(); } catch(e) { console.warn(e); toast('No se pudieron cargar los datos. Revisa tu conexión.'); return; }
    Data.subscribe();
    if (Auth.tipo === 'invite' || Auth.tipo === 'recovery') { history.replaceState(null, '', location.pathname); passModal(true); }
  },
  async loadAll(){
    const rows = [];
    for (let from = 0; ; from += 1000) {
      const { data, error } = await sb.from('docs').select('col,id,data').order('col').order('id').range(from, from + 999);
      if (error) throw error;
      rows.push(...data);
      if (data.length < 1000) break;
    }
    COLS.forEach(c => { S[c] = new Map(); }); S.cfg = {...DEFAULT_CFG}; S.finconfig = null;
    rows.forEach(r => applyDoc(r.col, r.id, r.data));
    S.ready = true; onData();
  },
  subscribe(){
    if (rt) sb.removeChannel(rt);
    rt = sb.channel('docs').on('postgres_changes', { event:'*', schema:'public', table:'docs' }, p => {
      if (p.eventType === 'DELETE') applyDoc(p.old.col, p.old.id, null); else applyDoc(p.new.col, p.new.id, p.new.data);
      onData();
    }).subscribe();
  },
  async set(col, id, data){
    if (S.demo) { Demo.set(col,id,data); return; }
    const { error } = await sb.from('docs').upsert({ col, id, data });
    if (error) throw error;
    applyDoc(col, id, data); onData();
  },
  async del(col, id){
    if (S.demo) { Demo.del(col,id); return; }
    const { error } = await sb.from('docs').delete().eq('col', col).eq('id', id);
    if (error) throw error;
    applyDoc(col, id, null); onData();
  },
  async setFinCfg(data){
    if (S.demo) { S.finconfig = data; onData(); return; }
    await Data.set('finconfig', 'general', data);
  },
  async setCfg(data){
    if (S.demo) { S.cfg = {...DEFAULT_CFG, ...data}; onData(); return; }
    await Data.set('config', 'empresa', data);
  },
  async nextNumero(name='trabajos'){
    const coll = name==='cotizaciones' ? S.cotizaciones : S.trabajos;
    if (S.demo) { Demo.counters[name] = Math.max(Demo.counters[name]||0, ...[...coll.values()].map(t=>t.numero||0)) + 1; return Demo.counters[name]; }
    const usados = [...coll.values()].reduce((m,t)=>Math.max(m,t.numero||0),0);
    const { data, error } = await sb.rpc('next_numero', { p_name:name, p_usados:usados });
    if (error || !data) throw new Error('No se pudo asignar el número correlativo. Intenta de nuevo.');
    return data;
  },
  async setCounter(ultimo, name='trabajos'){
    if (S.demo) { Demo.counters[name] = ultimo; return; }
    const { error } = await sb.from('docs').upsert({ col:'contadores', id:name, data:{ultimo} });
    if (error) throw error;
  },
  async getCounter(name='trabajos'){
    if (S.demo) return Demo.counters[name]||0;
    try { const { data } = await sb.from('docs').select('data').eq('col','contadores').eq('id',name).maybeSingle(); return (data && data.data.ultimo) || 0; } catch { return 0; }
  },
  photoSrc(id){ return S.demo ? (Demo.blobs.get(id) || '') : './_blob/' + id; },
  async upload(blob, o={}){
    if (S.demo) { const id='demo'+uid(''); Demo.blobs.set(id, URL.createObjectURL(blob)); return id; }
    const hex = [...crypto.getRandomValues(new Uint8Array(16))].map(b=>b.toString(16).padStart(2,'0')).join('');
    const name = (o.priv ? 'adm/' : '') + hex;
    const { error } = await sb.storage.from('fotos').upload(name, blob, { contentType: o.type || blob.type || 'image/jpeg' });
    if (error) throw new Error('No se pudo subir el archivo: ' + error.message);
    return name;
  },
  async dropPhoto(id){
    if (S.demo) { Demo.blobs.delete(id); return; }
    try { await sb.storage.from('fotos').remove([id]); } catch {}
  }
};

function totals(t, cfg=S.cfg){
  const serv = (t.items||[]).reduce((s,i)=>s+(+i.cant||0)*(+i.precio||0),0);
  const rep = (t.repuestos||[]).reduce((s,i)=>s+(+i.cant||0)*(+i.precio||0),0);
  const sum = Math.round(serv+rep);
  if (cfg.ivaModo==='incluido'){ const neto=Math.round(sum/1.19); return {serv,rep,neto,iva:sum-neto,total:sum,modo:'incluido'}; }
  if (cfg.ivaModo==='sin') return {serv,rep,neto:sum,iva:0,total:sum,modo:'sin'};
  const iva = Math.round(sum*0.19); return {serv,rep,neto:sum,iva,total:sum+iva,modo:'neto'};
}
function garantiaInfo(t){
  const aplica = !!t.garantia;
  const base = t.fechaEntrega || t.fecha || today();
  return {aplica, hasta: aplica ? addMonths(base, +S.cfg.garantiaMeses||3) : null};
}

async function saveCliente(){
  const r = S.route, isNew = r.name==='cliente-nuevo', err = $('#cerr'); err.textContent='';
  const nombre=$('#c-nombre').value.trim(), celular=$('#c-celular').value.trim(), correo=$('#c-correo').value.trim(), rut=$('#c-rut').value.trim();
  if (!nombre || !celular) { err.textContent='Nombre y celular son obligatorios.'; return; }
  if (correo && !/^\S+@\S+\.\S+$/.test(correo)) { err.textContent='Revisa el formato del correo.'; return; }
  let vd=null;
  if (isNew) { vd = readVeh(err); if (!vd) return; const ex = vehByPat(vd.patente); if (ex) { err.innerHTML = `La patente ${patHTML(ex.patente)} ya está registrada a nombre de ${esc(cli(ex.clienteId)?.nombre||'otro cliente')}. <button type="button" class="btn sm" data-act="nav" data-k="vehiculo" data-id="${esc(ex.id)}" data-force="1">Abrir vehículo</button>`; return; } }
  try {
    busy(true);
    if (isNew) {
      const cid = uid('c'), vid = uid('v');
      await Data.set('clientes', cid, {nombre, celular, correo, rut, creado:today(), creadoPor:S.uid});
      await Data.set('vehiculos', vid, {...vd, clienteId:cid, creado:today()});
      toast('Cliente registrado');
      if (r.then==='trabajo') go('trabajo-nuevo',{vid, force:true}); else go('vehiculo',{id:vid, force:true});
    } else {
      const c = cli(r.id);
      await Data.set('clientes', r.id, {...strip(c), nombre, celular, correo, rut});
      toast('Datos actualizados'); go('cliente',{id:r.id, force:true});
    }
  } catch(e){ err.textContent = writeErr(e); } finally { busy(false); }
}
const strip = o => { const x={...o}; delete x.id; return x; };
function writeErr(e){
  if (e && (e.code==='42501' || e.code==='invalid_argument')) return 'Tu usuario no tiene permiso para guardar esto.';
  if (e && /fetch|network/i.test(e.message||'')) return 'Sin conexión. Revisa tu internet e intenta de nuevo.';
  if (e && e.code==='quota_exceeded') return 'Se alcanzó el límite de almacenamiento de la app.';
  return 'No se pudo guardar' + (e && e.message ? ': '+e.message : '.') ;
}

async function onFiles(files, etapa){
  const list = [...files].filter(f=>/^image\//.test(f.type)); if (!list.length) return;
  D._uploading += list.length; drawFotos();
  for (const f of list) {
    try { const blob = await shrink(f); const id = await Data.upload(blob); D.fotos.push({id, etapa, nota:''}); D._new.push(id); }
    catch(e){ toast(e.message || 'No se pudo subir la foto.'); }
    finally { D._uploading--; drawFotos(); }
  }
}
async function shrink(file, max=1600){
  const bmp = await createImageBitmap(file, {imageOrientation:'from-image'}).catch(()=>createImageBitmap(file));
  const k = Math.min(1, max/Math.max(bmp.width,bmp.height));
  const c = document.createElement('canvas'); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  return await new Promise(r=>c.toBlob(r,'image/jpeg',0.82));
}
function cleanupDraft(){
  if (D && D._new && D._new.length && !D._saved) D._new.forEach(id=>Data.dropPhoto(id));
  D = null; Q = null;
}
async function saveTrabajo(){
  const err=$('#terr'); err.textContent='';
  if (!veh(D.vehiculoId)) { err.textContent='Selecciona el vehículo del trabajo.'; $('#tf-patq')?.focus(); return; }
  if (D._uploading) { err.textContent='Espera a que terminen de subir las fotos.'; return; }
  const v = veh(D.vehiculoId);
  const num = x => x===''||x==null ? '' : +x;
  const data = {vehiculoId:D.vehiculoId, clienteId:D.clienteId || v.clienteId,
    fecha:D.fecha||today(), km:num(D.km), tecnico:String(D.tecnico||'').trim(), estado:D.estado, refrigerante:D.refrigerante,
    gramos:num(D.gramos), pAlta:num(D.pAlta), pBaja:num(D.pBaja), tSalida:num(D.tSalida),
    diagnostico:String(D.diagnostico||'').trim(), trabajo:String(D.trabajo||'').trim(), comentarios:String(D.comentarios||'').trim(),
    items:D.items.map(i=>({codigo:i.codigo,nombre:i.nombre,cant:+i.cant||0,precio:+i.precio||0,unidad:i.unidad||'servicio'})).filter(i=>i.cant>0),
    repuestos:D.repuestos.map(i=>({desc:String(i.desc||'').trim(),cant:+i.cant||0,precio:+i.precio||0})).filter(i=>i.desc && i.cant>0),
    garantia:!!D.garantia, fotos:D.fotos.map(f=>({id:f.id,etapa:f.etapa,nota:String(f.nota||'').trim()})),
    fechaEntrega:D.fechaEntrega || (D.estado==='entregado'?today():''), creado:D.creado||today(), creadoPor:D.creadoPor||S.uid};
  if (data.fotos.length > 40) { err.textContent='Máximo 40 fotos por trabajo.'; return; }
  try {
    busy(true);
    const isNew = !D.id; const id = D.id || uid('t');
    data.numero = D.numero || await Data.nextNumero();
    await Data.set('trabajos', id, data);
    D._saved = true; D._removed.forEach(fid=>Data.dropPhoto(fid));
    toast(isNew ? 'Trabajo N° '+pad(data.numero)+' guardado' : 'Cambios guardados');
    go('trabajo',{id, force:true});
  } catch(e){ err.textContent = writeErr(e); } finally { busy(false); }
}

async function imgData(src, max=1100){
  const res = await fetch(src); if (!res.ok) throw new Error('img'); const b = await res.blob();
  const bmp = await createImageBitmap(b); const k=Math.min(1,max/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas'); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k);
  const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(bmp,0,0,c.width,c.height);
  return {data:c.toDataURL('image/jpeg',0.82), w:c.width, h:c.height};
}

async function makePDF(id, modo, btn){
  const t = S.trabajos.get(id); const msg=$('#pdfmsg');
  if (!window.jspdf) { msg.textContent='No se pudo cargar el generador de PDF. Revisa tu conexión y recarga la página.'; return; }
  btn.disabled = true; msg.textContent='Generando PDF…';
  try {
    const blob = await buildPDF(t, modo);
    const v = veh(t.vehiculoId);
    const name = (modo==='informe'?'Informe':'Presupuesto')+'_'+pad(t.numero)+'_'+normPat(v?.patente)+'.pdf';
    if (downloads) {
      try { await downloads.save({filename:name, data:blob}); msg.textContent='Listo: '+name; }
      catch(e){ msg.textContent = e.code==='declined' ? 'Descarga cancelada.' : 'No se pudo descargar el PDF ('+(e.code||'error')+').'; }
    } else {
      const url = URL.createObjectURL(blob);
      modal(`<div class="dlg" style="width:min(900px,100%);height:100%"><header><h2>${esc(name)}</h2></header><div class="body" style="padding:0"><iframe src="${url}" title="Vista previa PDF" style="width:100%;height:100%;min-height:60vh;border:0"></iframe></div><footer><span class="small muted" style="margin-right:auto">La descarga directa no está disponible en esta vista.</span><button class="btn" data-act="close">Cerrar</button></footer></div>`);
      msg.textContent='';
    }
  } catch(e){ console.error(e); msg.textContent='No se pudo generar el PDF: '+(e.message||e); }
  finally { btn.disabled = false; }
}

const COT_TIPOS = [['mantencion','Mantenimiento HVAC'],['instalacion','Instalación HVAC'],['electrico','Trabajos eléctricos'],['automotriz','Automotriz']];
const isAutoQ = q => (q?.tipos||[]).includes('automotriz');
const CAT_GRUPOS = [['mantencion','Mantenimiento HVAC','mantencion','MA'],['correctivo','Correctivo HVAC','mantencion','MC'],['material','Materiales y repuestos HVAC','mantencion','MT'],['instalacion','Instalación de equipos','instalacion','IN'],['adicional','Adicionales de instalación','instalacion','AD'],['electrico','Trabajos eléctricos','electrico','EL']];
const COT_ESTADOS = [['borrador','Borrador'],['enviada','Enviada'],['aceptada','Aceptada'],['rechazada','Rechazada']];
const AG_ESTADOS = [['pendiente','Por contactar'],['contactado','Contactado'],['agendado','Mantención agendada']];
const UNIDADES_ADM = [['unidad','Unidad'],['equipo','Equipo'],['m','Metro'],['hora','Hora'],['gl','Global']];
const usuf = u => ({m:'m', hora:'h', g:'g'})[u] || '';
const grupoLabel = g => g==='automotriz' ? 'Servicio automotriz' : (CAT_GRUPOS.find(x=>x[0]===g)||[g,'Ítem libre'])[1];
const grupoTipo = g => (CAT_GRUPOS.find(x=>x[0]===g)||[])[2];
const tipoLabel = k => (COT_TIPOS.find(x=>x[0]===k)||[k,k])[1];
const tipoTags = ts => (ts||[]).map(k=>`<span class="ttag ${esc(k)}">${esc(tipoLabel(k))}</span>`).join(' ');
const lbl = (arr,k) => (arr.find(x=>x[0]===k)||[k,k])[1];
const cotPill = k => `<span class="pill st-${esc(k)}">${esc(lbl(COT_ESTADOS,k))}</span>`;
const agPill = k => `<span class="pill st-${esc(k)}">${esc(lbl(AG_ESTADOS,k))}</span>`;
const addDays = (iso,d) => { const x=new Date(iso+'T12:00:00'); x.setDate(x.getDate()+(+d||0)); return x.toISOString().slice(0,10); };
const daysTo = iso => Math.round((new Date(iso+'T12:00:00') - new Date(today()+'T12:00:00'))/864e5);
const relDays = n => n===0 ? 'hoy' : n>0 ? `en ${n} día${n===1?'':'s'}` : `hace ${-n} día${n===-1?'':'s'}`;
const catAdm = () => [...S.catalogoadm.values()].sort((a,b)=>(a.orden||999)-(b.orden||999) || String(a.codigo).localeCompare(b.codigo));
function cotTotals(q){ const neto = Math.round((q.items||[]).reduce((s,i)=>s+(+i.precio||0)*(+i.cant||0),0)); const iva = q.conIVA ? Math.round(neto*0.19) : 0; return {neto, iva, total:neto+iva}; }
const cotHasta = q => q.hasta || addDays(q.fecha||today(), q.validez||S.cfg.cotValidez||30);
function garantiaPara(q){
  if (isAutoQ(q)) return String(S.cfg.garantiaTexto||'').replace('{meses}', S.cfg.garantiaMeses||3);
  const out=[]; const g = new Set((q.items||[]).map(i=>i.grupo));
  if ((q.tipos||[]).includes('mantencion')) out.push(g.has('correctivo')||g.has('material') ? S.cfg.garCorr : S.cfg.garMant);
  if ((q.tipos||[]).includes('instalacion')) out.push(S.cfg.garInst);
  if ((q.tipos||[]).includes('electrico')) out.push(S.cfg.garElec);
  return [...new Set(out.filter(Boolean))].join(' ');
}

function onQInput(e){
  const el = e.target;
  if (el.dataset.c) {
    Q.cliente[el.dataset.c] = el.value;
    if (el.dataset.c==='nombre' && e.type==='change') {
      const m = [...S.clientesadm.values()].find(c=>c.nombre.trim().toLowerCase()===el.value.trim().toLowerCase());
      if (m) { ['sucursal','rut','contacto','telefono','correo','direccion'].forEach(k=>{ if (!Q.cliente[k] && m[k]) { Q.cliente[k]=m[k]; const i=$('#qc-'+k); if(i) i.value=m[k]; } }); }
    }
    return;
  }
  if (el.dataset.q) {
    const k = el.dataset.q; Q[k] = el.type==='checkbox' ? el.checked : el.type==='number' ? +el.value : el.value;
    if (k==='garantia') Q.garantiaAuto = false;
    if (k==='fecha'||k==='validez') $('#q-hasta').textContent = fdate(addDays(Q.fecha||today(), Q.validez||0));
  } else if (el.dataset.tipo) {
    if (e.type!=='change') return;
    const k = el.dataset.tipo;
    if (el.checked) Q.tipos = k==='automotriz' ? ['automotriz'] : [...new Set([...Q.tipos.filter(x=>x!=='automotriz'),k])];
    else Q.tipos = Q.tipos.filter(x=>x!==k);
    syncAutoUI(); autoGarantia();
  } else if (el.dataset.v) {
    const k = el.dataset.v; Q.vehiculo[k] = el.value;
    if (k==='patente' && e.type==='change') {
      const vv = vehByPat(el.value);
      if (vv) { ['marca','modelo','anio'].forEach(x=>{ Q.vehiculo[x] = vv[x]||''; const i=$('#qv-'+x); if (i) i.value = vv[x]||''; });
        const c = cli(vv.clienteId); if (c) [['nombre',c.nombre],['telefono',c.celular],['correo',c.correo],['rut',c.rut]].forEach(([x,val])=>{ if (!Q.cliente[x] && val) { Q.cliente[x]=val; const i=$('#qc-'+x); if (i) i.value=val; } });
        toast('Vehículo encontrado: '+vv.marca+' '+vv.modelo); }
    }
    return;
  } else if (el.dataset.qi != null) {
    const it = Q.items[+el.dataset.qi], k = el.dataset.k;
    it[k] = k==='comprende' ? el.value.split('\n').map(x=>x.trim()).filter(Boolean) : (k==='precio'||k==='cant') ? (el.value===''?'':+el.value) : el.value;
    if (k==='comprende' && e.type==='input') it[k] = el.value.split('\n');
    const box = el.closest('.qitem'); if (box) { box.querySelector('.lt').textContent = clp((+it.precio||0)*(+it.cant||0)); const z=box.querySelector('.zero'); if (z) z.hidden = !!(+it.precio); }
  }
  drawQTot();
}

/* installation calculator */
function instCalcModal(){
  const eq = catAdm().filter(s=>s.grupo==='instalacion' && s.activo!==false);
  const ad = catAdm().filter(s=>s.grupo==='adicional' && s.activo!==false && s.regla!=='extension');
  if (!eq.length) { toast('No hay equipos en el catálogo de instalación.'); return; }
  modal(`<div class="dlg"><header><h2>Instalación de equipo</h2><p class="muted small" style="margin:0">El valor incluye equipo, kit de instalación básico (hasta 3 m entre unidades) e instalación.</p></header>
    <div class="body calc" id="icbox">
      <div class="grid">
        <div class="f c8"><label for="ic-eq">Equipo</label><select class="in" id="ic-eq">${eq.map(s=>`<option value="${esc(s.id)}">${esc(s.nombre)} · ${clp(s.precio)}</option>`).join('')}</select></div>
        <div class="f c4"><label for="ic-n">Cantidad de equipos</label><input class="in" id="ic-n" type="number" min="1" value="1"></div>
        <div class="f c6"><label for="ic-d">Distancia entre unidad interior y exterior</label><div class="unit"><input class="in" id="ic-d" type="number" min="0" step="0.5" value="3"><span>m</span></div><span class="hint">Sobre 3 m se cobra kit de extensión por cada metro adicional.</span></div>
      </div>
      ${ad.length?`<div class="stack" style="gap:8px">${ad.map(a=>`<label class="check"><input type="checkbox" data-ad="${esc(a.id)}"><span><b>${esc(a.nombre)}</b> <span class="muted small">${+a.precio?'+'+clp(a.precio)+(a.porEquipo?' por equipo':''):'precio por definir'}</span></span></label>`).join('')}</div>`:''}
      <div class="prev" id="ic-prev"></div>
    </div>
    <footer><button class="btn" data-act="close">Cancelar</button><button class="btn pri" data-act="ic-add">Agregar a la cotización</button></footer></div>`);
  const box = $('#icbox'); box.addEventListener('input', icPreview); box.addEventListener('change', icPreview); icPreview();
}
function icCompute(){
  const e = S.catalogoadm.get($('#ic-eq').value); const n = Math.max(1, Math.round(+$('#ic-n').value||1)); const d = Math.max(0, +$('#ic-d').value||0);
  const extra = Math.max(0, Math.ceil(d - 3)); const ext = catAdm().find(a=>a.regla==='extension' && a.activo!==false);
  const rows = [itemFromCat(e, n)];
  if (extra>0 && ext) { const it = itemFromCat(ext, extra*n); it.comprende = [...it.comprende, `${extra} m adicionales por equipo sobre los 3 m incluidos (distancia entre unidades: ${String(d).replace('.',',')} m)`]; rows.push(it); }
  document.querySelectorAll('[data-ad]').forEach(c=>{ if (c.checked) { const a = S.catalogoadm.get(c.dataset.ad); rows.push(itemFromCat(a, a.porEquipo ? n : 1)); } });
  return {rows, extra, ext};
}
function icPreview(){
  const {rows, extra, ext} = icCompute(); const tot = rows.reduce((s,r)=>s+r.precio*r.cant,0);
  $('#ic-prev').innerHTML = rows.map(r=>`<div><span>${esc(r.titulo)} × ${r.cant}${usuf(r.unidad)?' '+usuf(r.unidad):''}</span><span class="money">${+r.precio?clp(r.precio*r.cant):'<span class="zero">Por definir</span>'}</span></div>`).join('')
    + (extra>0 && !ext ? `<div class="err">Falta el kit de extensión en el catálogo.</div>`:'') + `<div style="border-top:1px solid var(--line);padding-top:4px;margin-top:2px"><b>Neto</b><b class="money">${clp(tot)}</b></div>`;
}

async function saveCot(){
  const err = $('#qerr'); err.textContent='';
  const cl = Object.fromEntries(Object.entries(Q.cliente).map(([k,v])=>[k,String(v||'').trim()]));
  if (!cl.nombre) { err.textContent='Ingresa el nombre del cliente.'; $('#qc-nombre').focus(); return; }
  const items = Q.items.map(i=>({codigo:i.codigo||'', grupo:i.grupo||'libre', titulo:String(i.titulo||'').trim(), comprende:(Array.isArray(i.comprende)?i.comprende:String(i.comprende||'').split('\n')).map(x=>String(x).trim()).filter(Boolean), precio:Math.round(+i.precio||0), cant:+i.cant||0, unidad:i.unidad||'unidad'}));
  if (!items.length) { err.textContent='Agrega al menos un ítem.'; return; }
  if (items.some(i=>!i.titulo)) { err.textContent='Cada ítem necesita un nombre.'; return; }
  if (items.some(i=>i.cant<=0)) { err.textContent='Revisa las cantidades: deben ser mayores que cero.'; return; }
  const fecha = Q.fecha || today(), validez = +Q.validez || +S.cfg.cotValidez || 30;
  const data = {fecha, validez, hasta:addDays(fecha, validez), cliente:cl, tipos:Q.tipos, items, conIVA:!!Q.conIVA,
    plazo:String(Q.plazo||'').trim(), garantia:String(Q.garantia||'').trim() || garantiaPara({...Q, items}), pago:String(Q.pago||'').trim(),
    estado:Q.estado||'borrador', notas:String(Q.notas||'').trim(), creado:Q.creado||today(), creadoPor:Q.creadoPor||S.uid,
    vehiculo: isAutoQ(Q) ? {patente:normPat(Q.vehiculo?.patente), marca:String(Q.vehiculo?.marca||'').trim(), modelo:String(Q.vehiculo?.modelo||'').trim(), anio:Q.vehiculo?.anio?+Q.vehiculo.anio:'', km:Q.vehiculo?.km?+Q.vehiculo.km:''} : null};
  try {
    busy(true);
    const isNew = !Q.id, id = Q.id || uid('q');
    data.numero = Q.numero || await Data.nextNumero('cotizaciones');
    await Data.set('cotizaciones', id, data);
    const ex = [...S.clientesadm.values()].find(c=>c.nombre.trim().toLowerCase()===cl.nombre.toLowerCase());
    const merged = {...(ex?strip(ex):{creado:today()}), ...Object.fromEntries(Object.entries(cl).filter(([,v])=>v))};
    if (!ex || JSON.stringify(merged)!==JSON.stringify(strip(ex))) await Data.set('clientesadm', ex?ex.id:uid('k'), merged);
    toast(isNew ? 'Cotización N° '+pad(data.numero)+' guardada' : 'Cambios guardados');
    go('cot',{id, force:true});
  } catch(e){ err.textContent = writeErr(e); } finally { busy(false); }
}

const pdfSafe = s => String(s ?? '').replace(/[“”″]/g,'"').replace(/[‘’′]/g,"'").replace(/[–—]/g,'-').replace(/…/g,'...').replace(/ /g,' ');
async function buildCotPDF(q){
  const {jsPDF} = window.jspdf;
  const doc = new jsPDF({unit:'mm', format:'a4'});
  const _t = doc.text.bind(doc), _s = doc.splitTextToSize.bind(doc);
  doc.text = (t,...a) => _t(Array.isArray(t)?t.map(pdfSafe):pdfSafe(t), ...a);
  doc.splitTextToSize = (t,...a) => _s(pdfSafe(t), ...a);
  const cfg = S.cfg, T = cotTotals(q), cl = q.cliente||{};
  const NAVY=[11,42,91], RED=[200,25,31], INK=[20,28,40], MUT=[95,108,128], LINE=[205,214,226], SOFT=[241,245,250], BLUE=[18,87,184], WHITE=[255,255,255];
  const M=16, W=178, BOTTOM=274;
  const lm = await getLogoMeta();
  const font = (st='normal', sz=9.5, col=INK) => { doc.setFont('helvetica', st); doc.setFontSize(sz); doc.setTextColor(...col); };
  const nro = 'Presupuesto N° '+pad(q.numero);
  let y;
  const cols = [{l:'CONCEPTO',w:W-28-20-30},{l:'VALOR UN.',w:28},{l:'CANT.',w:20},{l:'SUBTOTAL',w:30}];
  const tableHead = () => { doc.setFillColor(...NAVY); doc.rect(M,y,W,7.5,'F'); font('bold',7.8,WHITE); let x=M; cols.forEach((c,i)=>{ doc.text(c.l, i===0? x+3 : x+c.w/2, y+5, {align:i===0?'left':'center'}); x+=c.w; }); y+=7.5; };
  const newPage = (withHead) => { doc.addPage(); const lw=34; doc.addImage(LOGO,'PNG',M,10,lw,lw*lm.h/lm.w); font('bold',9,NAVY); doc.text(nro, M+W, 15, {align:'right'}); font('normal',8,MUT); doc.text(String(cl.nombre||''), M+W, 19.5, {align:'right'}); doc.setDrawColor(...RED); doc.setLineWidth(0.5); doc.line(M,24,M+W,24); y=31; if (withHead) tableHead(); };
  const ensure = (h, withHead) => { if (y+h > BOTTOM) newPage(withHead); };
  const section = (label, need=14) => { ensure(need); doc.setFillColor(...RED); doc.rect(M, y-3.4, 1.3, 4.4, 'F'); font('bold',10,NAVY); doc.text(label, M+3.5, y); y += 6.5; };
  const wrap = (text, w1, w) => { const words = pdfSafe(text).replace(/\s*\n\s*/g,' ').split(/\s+/).filter(Boolean); const out=[]; let cur='', lim=w1;
    words.forEach(wd=>{ const t = cur?cur+' '+wd:wd; if (doc.getTextWidth(t) > lim && cur) { out.push(cur); cur=wd; lim=w; } else cur=t; }); if (cur) out.push(cur); return out; };

  /* header */
  const lw = 68, lh = lw*lm.h/lm.w; doc.addImage(LOGO,'PNG',M,11,lw,lh);
  const bx = M+W-76, lc = 42, vc = 34, rh = 7;
  [['PRESUPUESTO N°', pad(q.numero).split('').join(' ')],['FECHA:', fdate(q.fecha)],['VÁLIDO HASTA:', fdate(cotHasta(q))]].forEach((r,i)=>{
    const ry = 11 + i*rh;
    if (i===0) { doc.setFillColor(...NAVY); doc.rect(bx,ry,lc+vc,rh,'F'); font('bold',8.6,WHITE); doc.text(r[0], bx+lc-3, ry+4.8, {align:'right'}); font('bold',10.5,WHITE); doc.text(r[1], bx+lc+vc/2, ry+4.9, {align:'center'}); }
    else { doc.setFillColor(...SOFT); doc.rect(bx,ry,lc,rh,'F'); font('bold',8.2,INK); doc.text(r[0], bx+lc-3, ry+4.8, {align:'right'}); font('normal',9.2,INK); doc.text(r[1], bx+lc+vc/2, ry+4.8, {align:'center'}); doc.setDrawColor(...LINE); doc.setLineWidth(0.25); doc.line(bx, ry+rh, bx+lc+vc, ry+rh); }
  });
  y = Math.max(11+lh, 11+3*rh) + 6;
  doc.setDrawColor(...RED); doc.setLineWidth(0.7); doc.line(M, y, M+W, y); y += 9;

  /* client */
  font('bold',7.2,MUT); doc.text('SEÑORES', M, y); y += 6;
  font('bold',15,INK); doc.splitTextToSize(String(cl.nombre||'').toUpperCase(), W).forEach(l=>{ doc.text(l, M, y); y+=6.2; });
  if (cl.sucursal) { font('bold',10.5,NAVY); doc.text(String(cl.sucursal).toUpperCase(), M, y-0.6); y += 5.4; }
  const det = [cl.rut&&'RUT '+cl.rut, cl.contacto&&'Atención: '+cl.contacto, cl.telefono, cl.correo].filter(Boolean).join('   ·   ');
  if (det) { font('normal',8.6,MUT); doc.splitTextToSize(det, W).forEach(l=>{ doc.text(l, M, y); y+=4.2; }); }
  if (cl.direccion) { font('normal',8.6,MUT); doc.text(String(cl.direccion), M, y); y+=4.2; }
  const vq = q.vehiculo;
  if (vq && (vq.patente||vq.marca)) { y += 1.5; font('bold',7.2,MUT); doc.text('VEHÍCULO', M, y); font('bold',9.6,NAVY);
    doc.text([vq.patente?'Patente '+fmtPat(vq.patente):'', [vq.marca,vq.modelo,vq.anio].filter(Boolean).join(' '), vq.km?Number(vq.km).toLocaleString('es-CL')+' km':''].filter(Boolean).join('   ·   '), M+18, y); y += 4.6; }
  y += 5;

  /* items table */
  tableHead();
  const cw = cols[0].w;
  (q.items||[]).forEach((it,i)=>{
    font('bold',9.4,INK); const tl = wrap(`${i+1}.  ${it.titulo}`, cw-6, cw-6);
    font('normal',8.6,INK); const cl2 = (it.comprende||[]).map((c,j)=>({n:`${i+1}.${j+1}.`, l:wrap(c, cw-17, cw-17)}));
    const h = Math.max(10, 3.6 + tl.length*4.4 + cl2.reduce((s,c)=>s+c.l.length*3.9,0) + 2.4);
    ensure(h, true);
    doc.setDrawColor(...LINE); doc.setLineWidth(0.25); doc.rect(M,y,W,h,'S');
    let x = M; cols.slice(0,-1).forEach(c=>{ x+=c.w; doc.line(x,y,x,y+h); });
    let ty = y+5.2; font('bold',9.4,INK); tl.forEach(l=>{ doc.text(l, M+3, ty); ty+=4.4; });
    font('normal',8.6,INK); cl2.forEach(c=>{ font('normal',8,MUT); doc.text(c.n, M+5, ty); font('normal',8.6,INK); c.l.forEach(l=>{ doc.text(l, M+14, ty); ty+=3.9; }); });
    const cy = y + h/2 + 1.3; x = M+cw;
    font('normal',9.2,INK); doc.text(clp(it.precio), x+cols[1].w-3, cy, {align:'right'}); x+=cols[1].w;
    doc.text(String(it.cant)+(usuf(it.unidad)?' '+usuf(it.unidad):''), x+cols[2].w/2, cy, {align:'center'}); x+=cols[2].w;
    font('bold',9.4,INK); doc.text(clp((+it.precio||0)*(+it.cant||0)), x+cols[3].w-3, cy, {align:'right'});
    y += h;
  });
  /* totals */
  const tr = q.conIVA ? [['NETO',T.neto],['IVA 19%',T.iva],['TOTAL',T.total]] : [['NETO',T.neto],['TOTAL',T.total]];
  ensure(tr.length*6.6+10);
  const tx = M+W-60;
  tr.forEach((r,i)=>{ const ry = y + i*6.6, last = i===tr.length-1;
    if (last) { doc.setFillColor(...NAVY); doc.rect(tx,ry,60,6.6,'F'); font('bold',9.6,WHITE); }
    else { doc.setFillColor(...SOFT); doc.rect(tx,ry,30,6.6,'F'); doc.setDrawColor(...LINE); doc.setLineWidth(0.25); doc.rect(tx,ry,60,6.6,'S'); font('bold',8.6,INK); }
    doc.text(r[0], tx+27, ry+4.5, {align:'right'}); doc.text(clp(r[1]), tx+57, ry+4.5, {align:'right'}); });
  y += tr.length*6.6 + 3;
  if (!q.conIVA) { font('italic',7.8,MUT); doc.text('Valores netos, no incluyen IVA.', M+W, y+1.5, {align:'right'}); y += 4; }
  y += 8;

  /* conditions */
  section('PLAZOS Y CONDICIONES');
  [['Plazo de entrega: ', q.plazo],['Garantía: ', q.garantia],['Forma de pago: ', q.pago]].filter(b=>b[1]).forEach(([lab, txt])=>{
    font('bolditalic',9,INK); const lw2 = doc.getTextWidth(lab);
    font('normal',9,INK); const lines = wrap(txt, W-11-lw2, W-11);
    ensure(lines.length*4.3+2);
    font('bold',9,INK); doc.text('•', M+4, y);
    font('bolditalic',9,INK); doc.text(lab, M+9, y);
    font('normal',9,INK); lines.forEach((l,i)=>{ doc.text(l, i===0 ? M+9+lw2 : M+9, y); y+=4.3; });
    y += 1.6;
  });
  y += 4;

  /* acceptance */
  const autoQ = isAutoQ(q);
  section(autoQ ? 'DATOS PARA EL PAGO' : 'ACEPTACIÓN DEL SERVICIO', 58);
  font('normal',9,INK); doc.splitTextToSize(autoQ ? 'Para aceptar este presupuesto basta con confirmarlo por WhatsApp o correo. Si paga por transferencia, use los siguientes datos:' : 'Para la aceptación de esta propuesta se debe emitir una Orden de Compra con los siguientes datos:', W-8).forEach(l=>{ doc.text(l, M+4, y); y+=4.3; });
  y += 3;
  const bw = (W-8)/2, rowH = 5.8;
  const box = (x, title, rows) => {
    doc.setFillColor(...NAVY); doc.rect(x,y,bw,7.5,'F'); font('bold',9,WHITE); doc.text(title, x+bw/2, y+5, {align:'center'});
    rows.forEach((r,i)=>{ const ry=y+7.5+i*rowH; doc.setDrawColor(...LINE); doc.setLineWidth(0.25); doc.rect(x,ry,bw,rowH,'S');
      const mail = /@/.test(r); font('normal',8.6, mail?BLUE:INK); doc.text(doc.splitTextToSize(String(r), bw-5)[0], x+2.5, ry+4); });
  };
  const oc = [cfg.razon, 'RUT: '+cfg.rut, cfg.giroOC, cfg.direccionOC, cfg.correo].filter(Boolean);
  const tf = [cfg.bancoTitular, 'RUT: '+cfg.rut, cfg.bancoCuenta, 'N° '+cfg.bancoNumero, cfg.bancoCorreo].filter(Boolean);
  if (autoQ) { box(M, 'DATOS DE TRANSFERENCIA', tf); y += 7.5 + tf.length*rowH + 9; }
  else { box(M, 'ORDEN DE COMPRA', oc); box(M+bw+8, 'DATOS DE TRANSFERENCIA', tf); y += 7.5 + Math.max(oc.length, tf.length)*rowH + 9; }

  /* closing + signature */
  const cierre = String(cfg.cotCierre||'').split('\n').filter(Boolean);
  ensure(cierre.length*4.3 + 30);
  font('normal',9,INK); cierre.forEach(c=>doc.splitTextToSize(c, W).forEach(l=>{ doc.text(l, M, y); y+=4.3; }));
  y += 6;
  const sl = 20, slh = sl*lm.h/lm.w, sx = M+W/2 - 30;
  doc.addImage(LOGO,'PNG',sx,y+1,sl,slh);
  const fx = sx+sl+4; let fy = y+2.5;
  font('bold',9,INK); doc.text(String(cfg.firmaNombre||''), fx, fy); fy+=4;
  font('normal',8.2,MUT); if (cfg.firmaCargo) { doc.text(String(cfg.firmaCargo), fx, fy); fy+=3.8; }

async function makeCotPDF(id, btn){
  const q = S.cotizaciones.get(id), msg = $('#pdfmsg');

  btn.disabled = true; msg.textContent = 'Generando PDF…';
  try {
    const blob = await buildCotPDF(q);
    const name = pad(q.numero).slice(-4)+'_PPTO_'+String(q.cliente?.nombre||'cliente').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_|_$/g,'').toUpperCase().slice(0,40)+'.pdf';
    if (downloads) {
      try { await downloads.save({filename:name, data:blob}); msg.textContent = 'Listo: '+name; }
      catch(e){ msg.textContent = e.code==='declined' ? 'Descarga cancelada.' : 'No se pudo descargar el PDF ('+(e.code||'error')+').'; }
    } else {

/* ================= PMP AC: programa, contratos e instalaciones ================= */
const PMP_TIPOS = ['Aire acondicionado','Cortina metálica','Ventilación','Otro'];
const PMP_EQUIPOS = ['Fancoil','Damper','Ducto','Muro','Split','Compacto','Cassette','Piso cielo','VRF','Manejadora','Chiller'];
const PERIODOS = [[1,'Mensual'],[2,'Bimestral'],[3,'Trimestral'],[4,'Cuatrimestral'],[6,'Semestral'],[12,'Anual']];
const perLabel = n => +n ? (PERIODOS.find(p=>p[0]===+n)||[0,`Cada ${n} meses`])[1] : 'Sin periodicidad';
const pmpList = () => [...S.pmp.values()];
const fechaEf = x => x.fechaAgendada || x.proxima || '';
const cap = s => s ? s[0].toUpperCase()+s.slice(1) : s;
const mesLabel = iso => cap(new Date(iso.slice(0,7)+'-15T12:00:00').toLocaleDateString('es-CL',{month:'long', year:'numeric'}));
function pmpEstado(p){
  if (p.activo===false) return 'finalizado';
  if (!p.proxima) return 'sinfecha';
  if (p.estado==='agendado' && p.fechaAgendada) return 'agendado';
  const d = daysTo(p.limite && p.limite < p.proxima ? p.limite : p.proxima);
  if (p.coordinar) return daysTo(p.limite||p.proxima) < 0 ? 'atrasada' : 'coordinar';
  return d < 0 ? 'atrasada' : d <= 30 ? 'proxima' : 'aldia';
}
const PMP_EST = {atrasada:['Atrasada','st-rechazada'], proxima:['Próximos 30 días','st-pendiente'], coordinar:['Por coordinar','st-pendiente'], agendado:['Agendada','st-agendado'], aldia:['Al día','st-entregado'], sinfecha:['Sin fecha','st-diagnostico'], finalizado:['Finalizado','st-entregado']};
const pmpPill = p => { const [l,c] = PMP_EST[pmpEstado(p)]; return `<span class="pill ${c}">${l}</span>`; };
const visitas = p => (+p.visitasPrevias||0) + (p.historial||[]).length;

  const out = [];

    titulo:p.contrato?.nombre || p.empresa, lugar:p.contrato ? [p.empresa,p.local].filter(Boolean).join(' · ') : p.local,
    detalle:[p.equipo||p.tipo, p.cantidad?'× '+p.cantidad:'', perLabel(p.periodicidad)].filter(Boolean).join(' '), limite:p.limite||'', coordinar:!!p.coordinar,
    contacto:p.contacto, telefono:p.telefono, src:p}));
  [...S.instalaciones.values()].filter(i=>!i.pmpId && i.proxima).forEach(i=>out.push({kind:'inst', col:'instalaciones', id:i.id, fecha:i.fechaAgendada||i.proxima, proxima:i.proxima, agendada:i.fechaAgendada||'', estado:i.estado||'pendiente',

    contacto:i.cliente?.contacto, telefono:i.cliente?.telefono, src:i}));
  return out.sort((a,b)=>a.fecha.localeCompare(b.fecha));
}
function agendaPendientes(){
  const l7 = addDays(today(),7), lA = addDays(today(), +S.cfg.avisoDias||30);
  return agendaItems().filter(x => x.estado==='pendiente' && (x.kind==='inst' ? x.proxima<=lA : x.kind==='contrato' ? (x.limite||x.proxima)<=addDays(today(),30) : x.proxima<=l7));
}
const KIND = {pmp:'PMP', contrato:'Contrato', inst:'Instalación'};
Views.agenda = () => {
  const f = S.fag || 'todo';
  const all = agendaItems(); const items = all.filter(x=>f==='todo'||x.kind===f);
  const hoy = today(), mes = hoy.slice(0,7), hasta = addMonths(mes+'-01', 3).slice(0,7);
  const atras = items.filter(x=>x.fecha < hoy && x.estado!=='agendado' || (x.estado==='agendado' && x.agendada < hoy));
  const rest = items.filter(x=>!atras.includes(x));
  const meses = [...new Set(rest.map(x=>x.fecha.slice(0,7)))].filter(m=>m<=hasta).sort();
  const later = rest.filter(x=>x.fecha.slice(0,7) > hasta);
  const n = k => k==='todo' ? all.length : all.filter(x=>x.kind===k).length;
  const sect = (t, arr, extra='') => arr.length ? `<div class="secthead"><h2>${t}</h2><span class="muted small">${arr.length} ${extra}</span></div><div class="list">${arr.map(agItem).join('')}</div>` : '';
  return `<div class="head"><div><h1>Agenda</h1><p>Mantenciones del programa PMP, visitas de contratos y mantención anual de equipos instalados.</p></div><div class="row"><button class="btn" data-act="area" data-k="pmp">Ver programa PMP</button></div></div>
  <div class="chips" style="margin-bottom:6px">${[['todo','Todo'],['pmp','PMP'],['contrato','Contratos'],['inst','Instalaciones']].map(([k,l])=>`<button class="chip" data-act="fag" data-k="${k}" aria-pressed="${f===k}">${l}<span class="n">${n(k)}</span></button>`).join('')}</div>
  ${sect('Atrasadas', atras, 'por regularizar')}
  ${meses.map(m=>sect(mesLabel(m)+(m===mes?' · este mes':''), rest.filter(x=>x.fecha.slice(0,7)===m))).join('')}
  ${later.length?`<p class="muted small" style="margin-top:18px">${later.length} mantención${later.length>1?'es':''} más adelante de ${mesLabel(hasta)}. Revísalas en PMP AC.</p>`:''}
  ${!items.length?`<div class="empty" style="margin-top:16px">Nada en la agenda. Registra programas en PMP AC o instalaciones desde una cotización aceptada.</div>`:''}`;
};
function agItem(x){
  const d = daysTo(x.fecha), late = x.fecha < today() && x.estado!=='agendado';
  const p = x.src, cl = x.kind==='inst' ? (p.cliente||{}) : {};

    : `Estimado/a ${x.contacto||''}, le saluda ${S.cfg.razon}. Corresponde la mantención programada de ${x.detalle.split(' · ')[0]} en ${x.titulo}${x.lugar?' '+x.lugar:''}. ¿Qué fecha le acomoda para la visita?`;
  const dateTxt = x.coordinar && !x.agendada ? mesLabel(x.proxima) : fdate(x.fecha);

      <button class="btn sm" data-act="x-cot" data-col="${x.col}" data-id="${esc(x.id)}">Cotizar</button>

async function pmpSave(id, isContrato){
  const g = k => $('#pm-'+k).value.trim(), err=$('#pmerr');
  if (!g('emp')) { err.textContent='Ingresa el cliente o institución.'; return; }
  if (isContrato && !g('cn')) { err.textContent='Ingresa el nombre del contrato.'; return; }
  const prev = id ? strip(S.pmp.get(id)) : {historial:[], estado:'pendiente', creado:today()};
  const data = {...prev, empresa:g('emp'), local:g('loc'), tipo:g('tipo'), equipo:g('eq'), cantidad:g('cant')===''?'':+g('cant'), valor:g('val')===''?'':+g('val'),
    periodicidad:+g('per')||null, ultima:g('ult'), proxima:g('prox'), limite:g('lim'), coordinar:$('#pm-coord').checked, contacto:g('con'), telefono:g('tel'), correo:g('mail'), notas:g('notas'),
    activo: id ? $('#pm-act').checked : true,
    contrato: isContrato ? {nombre:g('cn'), inicio:g('ci'), fin:g('cf'), detalle:g('cd')} : null};
  try { busy(true); await Data.set('pmp', id || uid('p'), data); modal(''); toast(id?'Cambios guardados':'Programa creado'); } catch(e){ err.textContent=writeErr(e); } finally { busy(false); }
}

const FORMAS_PAGO = ['Transferencia','Efectivo','Tarjeta','Tarjeta de débito','Tarjeta de crédito','Cheque','Otro'];
const GASTO_TIPOS = [['fijo','Gastos fijos'],['variable','Gastos variables'],['directo','Costos directos e insumos']];
const GASTO_CATS = {
  fijo:['Arriendo','Sueldos','Previsión (Previred)','Impuestos (F29)','Contador','Asesorías y mentorías','Telefonía e internet','Publicidad','Software y suscripciones','Seguros','Otros fijos'],
  variable:['Combustible','Colación','Estacionamiento y peajes','Mantención vehículo','Herramientas','Reparaciones','Rendiciones','Otros variables'],
  directo:['Equipos','Repuestos y materiales','Refrigerante','Mano de obra externa','Subcontratos','Fletes','Otros directos']};
const MES_CORTO = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const finTipoLabel = k => lbl(FIN_TIPOS,k);
const ingIva = i => i.afecto===false ? 0 : Math.round((+i.neto||0)*0.19);
const ingBruto = i => (+i.neto||0) + ingIva(i);
const gNeto = g => g.conFactura ? Math.round((+g.monto||0)/1.19) : (+g.monto||0);
const gIva = g => g.conFactura ? (+g.monto||0) - Math.round((+g.monto||0)/1.19) : 0;
const finIngs = () => [...S.finingresos.values()];
const finGastos = () => [...S.fingastos.values()].filter(g=>!g.omitido && !g.recuperable);
const finFecha = (i, base) => base==='caja' ? (i.pagado ? (i.fechaPago||i.fecha) : '') : (i.soloCaja ? '' : i.fecha);
const diasEmitida = i => -daysTo(i.fechaFactura||i.fecha);
const vencida = i => !i.pagado && i.tipo==='factura' && diasEmitida(i) > 30;
const finCfg = () => S.finconfig || {};

function finAgg(year, base){

  finIngs().forEach(i=>{ const f = finFecha(i, base); if (!f || f.slice(0,4)!==String(year)) return; const x = m[+f.slice(5,7)-1]; x[i.tipo] = (x[i.tipo]||0) + (+i.neto||0); x.ing += (+i.neto||0); });
  finGastos().forEach(g=>{ if (String(g.fecha).slice(0,4)!==String(year)) return; const x = m[+g.fecha.slice(5,7)-1]; x[g.tipo] = (x[g.tipo]||0) + gNeto(g); x.gas += gNeto(g); });

}
function porRegistrar(){

  const out = [];

    const v=veh(t.vehiculoId), c=cli(t.clienteId); out.push({key, fecha:t.fechaEntrega||t.fecha, titulo:`Trabajo N° ${pad(t.numero)} · ${c?.nombre||''}`, sub:`${v?v.marca+' '+v.modelo+' '+fmtPat(v.patente):''}`, neto:totals(t).neto, pre:finPreTrabajo(t)}); });

Views.fin_after = () => { $('#fin-year')?.addEventListener('change', e=>{ S.finYear = +e.target.value; render(); }); wireTips(); };
function monthChart(agg){
  const W=760, H=250, L=58, R=10, T=14, B=26, pw=W-L-R, ph=H-T-B;
  const max = nice(Math.max(1,...agg.map(x=>Math.max(x.ing,x.gas))));
  const y = v => T + ph - v/max*ph, col = pw/12, bw = Math.min(22, col*0.32);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ingresos por tipo y gastos por mes" style="width:100%;height:auto;display:block">`;
  for (let k=0;k<=4;k++){ const v=max*k/4, yy=y(v); s += `<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${yy+4}" text-anchor="end" font-size="11" fill="var(--muted)">${clpK(v)}</text>`; }
  const rt = (x,y0,w,h,r,fill) => { if (h<=0) return ''; r=Math.min(r,h,w/2); return `<path d="M${x},${y0+h}V${y0+r}Q${x},${y0} ${x+r},${y0}H${x+w-r}Q${x+w},${y0} ${x+w},${y0+r}V${y0+h}Z" fill="${fill}"/>`; };
  agg.forEach((x,i)=>{
    const cx = L + col*i + col/2, x1 = cx - bw - 1, x2 = cx + 1;
    let acc = 0; const segs = FIN_TIPOS.map(([k])=>[k,x[k]]).filter(z=>z[1]>0);
    segs.forEach(([k,v],j)=>{ const top = j===segs.length-1; const y0 = y(acc+v), h = (y(acc)-y0) - (top?0:2); s += top ? rt(x1,y0,bw,h,3,FIN_SERIE[k]) : `<rect x="${x1}" y="${y0+2}" width="${bw}" height="${Math.max(0,h)}" fill="${FIN_SERIE[k]}"/>`; acc += v; });
    if (x.gas>0) s += rt(x2, y(x.gas), bw, y(0)-y(x.gas), 3, 'var(--s-gasto)');
    s += `<text x="${cx}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${MES_CORTO[i]}</text>`;
    const tip = `<b>${MES_CORTO[i]}</b>${FIN_TIPOS.map(([k,l])=>x[k]?`<div><i style="background:${FIN_SERIE[k]}"></i>${l}<span>${clp(x[k])}</span></div>`:'').join('')}<div><i></i>Total ingresos<span>${clp(x.ing)}</span></div><div><i style="background:var(--s-gasto)"></i>Gastos<span>${clp(x.gas)}</span></div><div><i></i>Utilidad<span>${clp(x.util)}</span></div>`;
    s += `<rect x="${L+col*i}" y="${T}" width="${col}" height="${ph}" fill="transparent" data-tip="${esc(tip)}" class="hit"/>`;
  });
  s += `<line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--muted)" stroke-width="1"/></svg><div class="tip" hidden></div>`;
  return s;
}
function wireTips(){

    box.addEventListener('pointermove', e=>{ const t = e.target.closest('[data-tip]'); if (!t) { tip.hidden=true; box.querySelectorAll('.hit.on').forEach(h=>h.classList.remove('on')); return; }

      if (x + tip.offsetWidth > r.width) x = e.clientX - r.left - tip.offsetWidth - 14; tip.style.left = Math.max(0,x)+'px'; tip.style.top = yy+'px'; });

  const weeks = []; let w = Array(first).fill(null);
  for (let d=1; d<=dias; d++){ w.push(d); if (w.length===7){ weeks.push(w); w=[]; } } if (w.length) weeks.push([...w, ...Array(7-w.length).fill(null)]);

      const tip = `<b>${fdate(iso)}</b>${FIN_TIPOS.map(([k,l])=>x[k]?`<div><i style="background:${FIN_SERIE[k]}"></i>${l}<span>${clp(x[k])}</span></div>`:'').join('')||'<div>Sin ingresos</div>'}`;

      + `<div class="cw"><b class="money">${clp(wt)}</b><small>meta ${clpK(wm)} · ${wm?Math.round(wt/wm*100):0}%</small></div>`; }).join('');
  const mi = finIngs().filter(i=>ymOf(finFecha(i,base))===ym), mg = finGastos().filter(x=>ymOf(x.fecha)===ym);
  const byT = k => mi.filter(i=>i.tipo===k).reduce((s,i)=>s+(+i.neto||0),0), byG = k => mg.filter(x=>x.tipo===k).reduce((s,x)=>s+gNeto(x),0);
  const gas = mg.reduce((s,x)=>s+gNeto(x),0);

async function ingresoSave(id){
  const err=$('#fierr'), v = k => $('#fi-'+k).value.trim();
  const tipo=v('tipo'), neto=Math.round(+v('neto')||0);
  if (!v('cli')) { err.textContent='Ingresa el cliente.'; return; }
  if (!(neto>0)) { err.textContent='Ingresa el monto neto.'; return; }
  const prev = id ? strip(S.finingresos.get(id)) : {creado:today(), ...(S.finPre?.origen?{origen:S.finPre.origen}:{})};
  const pagado = $('#fi-pag').checked;
  const data = {...prev, tipo, fecha:v('fecha')||today(), cliente:v('cli'), detalle:v('det'), neto, afecto:$('#fi-afecto').checked, nFactura: tipo==='factura'?v('nf'):'', nOC: tipo==='factura'?v('oc'):'', pagado, fechaPago: pagado?(v('fp')||today()):'', formaPago: pagado?v('forma'):'', notas:v('notas')};
  if (tipo==='factura' && data.nFactura && finIngs().some(x=>x.id!==id && x.tipo==='factura' && String(x.nFactura)===data.nFactura) && !S.finDupOk) { err.innerHTML='Ya existe una factura con ese número. <button class="btn sm" data-act="fin-dup-ok">Guardar igual</button>'; return; }
  S.finDupOk = false;
  try { busy(true); await Data.set('finingresos', id || uid('fi'), data); modal(''); toast(id?'Ingreso actualizado':'Ingreso registrado'); } catch(e){ err.textContent=writeErr(e); } finally { busy(false); }
}
